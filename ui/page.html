<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grove</title>
<script src="/webui.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ea;
    --paper: #fffcf7;
    --ink: #1d1a16;
    --muted: #6f675d;
    --line: #e3dcd1;
    --mark: #f0e2b4;
    --focus: #8a4e22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, sans-serif;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  .wrap {
    width: min(40rem, calc(100% - clamp(1rem, 4vw, 2.5rem)));
    margin: 0 auto;
    padding: clamp(1.25rem, 4vh, 2.25rem) 0 4rem;
  }
  .wrap:not(.split):has(#library-view:not([hidden])) {
    width: min(64rem, calc(100% - clamp(1rem, 4vw, 2.5rem)));
  }
  .wrap.split {
    width: min(76rem, calc(100% - clamp(0.75rem, 2vw, 1.5rem)));
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: minmax(min(100%, 16rem), 24rem) minmax(0, 1fr);
    column-gap: clamp(0.8rem, 2vw, 1.75rem);
    padding: 1.1rem 0 0;
    overflow: hidden;
  }
  #search-col, #reader-col { min-width: 0; }
  .wrap.split #search-col,
  .wrap.split #reader-col {
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    padding-bottom: 3rem;
  }
  #reader-col[hidden] { display: none; }
  @media (max-width: 860px) {
    .wrap.split {
      height: auto;
      overflow: visible;
      grid-template-columns: 1fr;
      row-gap: 1.5rem;
      padding-bottom: 3rem;
    }
    .wrap.split #search-col,
    .wrap.split #reader-col { overflow: visible; }
  }
  header p {
    margin: 0 0 0.85rem;
    color: var(--muted);
    font-size: 0.82rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header p.error { color: #8a2a1a; white-space: normal; }
  form { margin: 0; position: relative; }
  button.go {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 1.15rem;
    padding: 0.72rem 0.85rem;
    border: 1px solid #d8d0c4;
    border-radius: 10px;
    background: var(--paper);
    color: inherit;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: transparent;
  }
  input.also {
    margin-top: 0.45rem;
    font-size: 1rem;
    padding: 0.55rem 0.85rem;
  }
  input.also::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 0; }
  .chips:empty { margin: 0; }
  .chips:not(:empty) { margin-top: 0.7rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border: 1px solid #ddd4c8;
    background: var(--paper);
    border-radius: 999px;
    padding: 0.12rem 0.45rem 0.12rem 0.7rem;
    font-size: 0.85rem;
  }
  .chip button { color: var(--muted); padding: 0 0.2rem; line-height: 1; }
  .chip.facet { padding-right: 0.7rem; color: var(--muted); }
  .chip.facet .n { font-variant-numeric: tabular-nums; }
  .chip.facet:hover, .chip.facet:focus-visible { color: var(--ink); border-color: #c4b8a8; }
  .help, .count {
    margin: 0.7rem 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .saved { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; min-height: 0; }
  .saved:empty { margin: 0; }
  .saved:not(:empty) { margin-top: 0.45rem; }
  .saved .chip .q {
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 16rem;
  }
  button.save { color: var(--focus); font-size: 0.85rem; padding: 0.12rem 0.15rem; }
  button.save:hover { text-decoration: underline; }
  button.watch, button.unwatch {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0.12rem 0.15rem;
  }
  button.watch:hover, button.unwatch:hover { color: var(--focus); }
  .saved .chip button.new {
    color: var(--focus);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    padding: 0 0.15rem;
  }
  .note-slot { min-height: 0; }
  button.note-add {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 0.15rem;
  }
  button.note-add:hover { color: var(--focus); }
  .note {
    margin: 0.2rem 0 0;
    font-size: 0.88rem;
    display: flex;
    gap: 0.45rem;
    align-items: baseline;
  }
  .note span { overflow-wrap: anywhere; }
  .note button { color: var(--muted); padding: 0 0.15rem; }
  input.note-in {
    width: 100%;
    margin-top: 0.25rem;
    font-size: 0.9rem;
    padding: 0.35rem 0.6rem;
  }
  .count { min-height: 1.2em; }
  .err {
    margin: 0.8rem 0 0;
    color: #8a2a1a;
  }
  article { margin-top: 1.7rem; }
  .name {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.28rem;
    line-height: 1.3;
  }
  .name:hover, .passage:hover .text { background: #efe8dc; }
  .folder, .doctitle {
    margin: 0.15rem 0 0;
    color: var(--muted);
    font-size: 0.82rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .passage {
    display: block;
    width: 100%;
    margin-top: 0.75rem;
  }
  .where {
    color: var(--muted);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
  }
  .text {
    margin: 0.12rem 0 0;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.05rem;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  mark {
    background: var(--mark);
    color: inherit;
    padding: 0 0.12em;
    border-radius: 2px;
  }
  .more {
    margin-top: 0.55rem;
    color: var(--focus);
    font-size: 0.88rem;
  }
  .more:hover { text-decoration: underline; }
  .passage.open { box-shadow: inset 2px 0 0 #c4b8a8; }
  .passage.on { background: #efe8dc; }
  .tabs {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 0.35rem 0.4rem;
    background: var(--bg);
    padding: 0.1rem 0 0.55rem;
  }
  .tabs button.tab {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    max-width: min(16rem, 100%);
    min-width: 0;
    flex: 0 0 auto;
    border: 1px solid #ddd4c8;
    background: transparent;
    border-radius: 999px;
    padding: 0.16rem 0.4rem 0.16rem 0.7rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .tabs button.tab.on { color: var(--ink); background: var(--paper); }
  .tabs .tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .tabs .tab-x { color: var(--muted); padding: 0 0.15rem; line-height: 1; }
  .tabs button.tab.on .tab-x { color: var(--focus); }
  .reader[hidden] { display: none; }
  .reader-bar {
    position: sticky;
    top: var(--tabs-h, 2.35rem);
    z-index: 3;
    background: var(--bg);
    padding: 0.45rem 0 0.55rem;
  }
  .reader-nav { display: flex; gap: 1rem; margin: 0; }
  .reader-nav button { color: var(--focus); font-size: 0.88rem; }
  .reader-nav button:hover { text-decoration: underline; }
  .reader-nav button:disabled { color: var(--line); text-decoration: none; cursor: default; }
  .reader-where { margin: 0.35rem 0 0; }
  .reader-title {
    margin: 0.85rem 0 0;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: clamp(1.28rem, 1.05rem + 1.4vw, 1.55rem);
    font-weight: normal;
    line-height: 1.25;
  }
  .reader-body {
    margin-top: 1rem;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.12rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .page-label {
    display: block;
    margin: 1.15rem 0 0.35rem;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
  }
  .toc { margin-top: 0.7rem; }
  .toc summary { color: var(--muted); cursor: pointer; font-size: 0.85rem; }
  .toc div { max-height: 14rem; overflow: auto; margin-top: 0.3rem; }
  .toc button { display: block; width: 100%; font-size: 0.92rem; padding: 0.12rem 0; }
  .toc button.lv2 { padding-left: 0.9rem; }
  .toc button.lv3 { padding-left: 1.8rem; }
  .toc button:hover { background: #efe8dc; }
  #index {
    margin: 0 0 0.7rem;
    color: var(--muted);
    font-size: 0.82rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #index.error { color: #8a2a1a; white-space: normal; }
  .modes {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    gap: 0.9rem;
    background: var(--bg);
    margin: 0 0 0.85rem;
    padding: 0.1rem 0 0.45rem;
  }
  .modes button { color: var(--muted); font-size: 0.95rem; }
  .modes button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--focus); }
  #search-view[hidden], #library-view[hidden] { display: none; }
  #library-view { container-type: inline-size; }
  .lib-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem 1.1rem;
    margin-top: 0.85rem;
  }
  .lib-tools button { flex: 0 0 auto; color: var(--focus); font-size: 0.95rem; padding: 0.35rem 0; }
  .lib-tools button:hover, .lib-actions button:hover { text-decoration: underline; }
  #lib-filter { flex: 1 1 14rem; margin: 0; font-size: 1rem; padding: 0.55rem 0.75rem; }
  .lib-status { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
  .lib-root, .lib-meta, .lib-path {
    margin: 0.12rem 0 0;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .lib-path, .lib-root {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lib-row { margin-top: 1.45rem; }
  .lib-title {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .lib-title:hover { background: #efe8dc; }
  .lib-actions { display: flex; flex-wrap: wrap; gap: 0.35rem 0.85rem; align-items: baseline; margin-top: 0.15rem; }
  .lib-actions button { color: var(--focus); font-size: 0.9rem; }
  .lib-ask { flex: 1 0 100%; margin: 0.35rem 0 0; color: var(--muted); font-size: 0.85rem; }
  @container (min-width: 36rem) {
    .lib-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 1.25rem;
      align-items: start;
    }
    .lib-actions {
      grid-column: 2;
      grid-row: 1 / span 3;
      margin-top: 0.15rem;
      justify-content: flex-end;
    }
    .lib-actions:has(.lib-ask) {
      grid-column: 1 / -1;
      grid-row: auto;
      justify-content: flex-start;
    }
  }
  .modal[hidden] { display: none; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: clamp(0.5rem, 2vw, 1.25rem);
    background: rgba(29, 26, 22, 0.38);
    overscroll-behavior: contain;
  }
  .modal-card {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    width: min(44rem, 100%);
    max-height: 100%;
    min-height: 0;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: clamp(0.9rem, 2.4vw, 1.35rem);
    box-shadow: 0 18px 50px rgba(29, 26, 22, 0.18);
  }
  .modal-card:focus { outline: none; }
  .modal-title {
    margin: 0;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: clamp(1.2rem, 1rem + 1.2vw, 1.55rem);
    font-weight: normal;
    line-height: 1.25;
  }
  .modal-card .lib-path {
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
    overflow-wrap: anywhere;
    margin-top: 0.35rem;
  }
  .modal-fields {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem 1rem;
    margin-top: 0.95rem;
    overflow: auto;
    min-height: 0;
    overscroll-behavior: contain;
  }
  @container (min-width: 34rem) {
    .modal-fields { grid-template-columns: 1fr 1fr; }
    .modal-fields label.span { grid-column: 1 / -1; }
  }
  .modal-fields label {
    display: flex;
    flex-direction: column;
    gap: 0.22rem;
    margin: 0;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .modal-fields input, .modal-fields textarea {
    font-size: 1rem;
    padding: 0.5rem 0.7rem;
  }
  .modal-fields textarea { min-height: 4.5rem; resize: vertical; }
  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.1rem;
    margin-top: 0.85rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
  }
  .modal-actions button { color: var(--focus); font-size: 0.95rem; }
  .modal-actions button:hover { text-decoration: underline; }
  .wrap:not(.split):has(#search-narrow:not([hidden])) {
    width: min(58rem, calc(100% - clamp(1rem, 4vw, 2.5rem)));
  }
  #search-view { container-type: inline-size; }
  .narrow-open { color: var(--focus); font-size: 0.9rem; margin: 0.15rem 0 0.35rem; }
  .narrow-open[hidden] { display: none; }
  .narrow-aside { display: none; }
  .shelf { min-width: 0; }
  @container (min-width: 38rem) {
    .shelf:has(> .narrow-aside:not([hidden])) {
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr);
      column-gap: clamp(1.25rem, 3vw, 2.5rem);
      align-items: start;
    }
    .shelf:has(> .narrow-aside:not([hidden])) > .narrow-aside {
      display: block;
      position: sticky;
      top: 0.25rem;
      max-height: calc(100dvh - 1.5rem);
      overflow: auto;
    }
    .narrow-open { display: none; }
  }
  .narrow-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
  .narrow-title {
    margin: 0;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .narrow-clear { color: var(--focus); font-size: 0.82rem; }
  .narrow-clear:hover { text-decoration: underline; }
  .narrow-group { border: 0; margin: 0.95rem 0 0; padding: 0; min-width: 0; }
  .narrow-group legend { padding: 0; margin: 0 0 0.15rem; color: var(--muted); font-size: 0.78rem; }
  .narrow-opt {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.65rem;
    padding: 0.28rem 0.4rem;
    border-radius: 6px;
    font-size: 0.92rem;
  }
  .narrow-opt .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .narrow-opt .n { color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .narrow-opt[aria-pressed="true"] { background: var(--mark); }
  .narrow-opt:hover { background: #efe8dc; }
  .narrow-opt[aria-pressed="true"]:hover { background: var(--mark); }
  .narrow-empty { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .narrow-sheet[hidden] { display: none; }
  .narrow-sheet {
    position: fixed;
    inset: 0;
    z-index: 28;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    padding: clamp(0.8rem, 3vw, 1.25rem);
  }
  .narrow-sheet .narrow-body { overflow: auto; min-height: 0; flex: 1; }
  .narrow-done { color: var(--focus); font-size: 0.95rem; margin-top: 0.8rem; align-self: flex-start; }
  .narrow-done:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div id="search-col">
    <p id="index"></p>
    <div class="modes">
      <button type="button" id="mode-search" class="mode on" aria-pressed="true">Search</button>
      <button type="button" id="mode-library" class="mode" aria-pressed="false">Library</button>
    </div>
    <div id="search-view">
    <button type="button" id="search-narrow-open" class="narrow-open" hidden>Narrow</button>
    <div class="shelf">
    <aside id="search-narrow" class="narrow-aside" hidden></aside>
    <div class="shelf-main">
    <header id="search-head">
      <form id="find">
        <input id="q" type="text" placeholder="Search" aria-label="Search" autocomplete="off" spellcheck="false" autofocus>
        <input id="also" class="also" type="text" placeholder="Also" aria-label="Also containing" autocomplete="off" spellcheck="false">
        <button type="submit" class="go" tabindex="-1">Search</button>
      </form>
      <div class="chips" id="chips"></div>
      <p class="help">Space means AND. OR and NOT are capitals. Quotes are a phrase. A trailing * is a prefix.</p>
      <div class="saved" id="saved"></div>
      <p class="count" id="count"></p>
      <p class="err" id="err" hidden></p>
    </header>
    <main id="results"></main>
    </div>
    </div>
    </div>
    <div id="library-view" hidden>
      <button type="button" id="lib-narrow-open" class="narrow-open">Narrow</button>
      <div class="shelf">
      <aside id="lib-narrow" class="narrow-aside"></aside>
      <div class="shelf-main">
      <p class="help">Add a folder or a file. Edit describes the volume. The text stays in the file.</p>
      <div class="lib-tools">
        <button type="button" id="lib-folder">Add a folder</button>
        <button type="button" id="lib-file">Add a file</button>
        <input id="lib-filter" type="text" placeholder="Title, creator, subject, or path" aria-label="Filter the library" autocomplete="off" spellcheck="false">
      </div>
      <div id="lib-roots"></div>
      <p class="lib-status" id="lib-status"></p>
      <p class="count" id="lib-count"></p>
      <p class="err" id="lib-err" hidden></p>
      <div id="lib-rows"></div>
      </div>
      </div>
    </div>
    </div>
    <div id="reader-col" hidden>
      <div class="tabs" id="tabs"></div>
      <div id="panes"></div>
    </div>
  </div>
  <form id="lib-edit" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lib-edit-title" tabindex="-1">
      <h2 id="lib-edit-title" class="modal-title"></h2>
      <p class="lib-path" id="lib-edit-path"></p>
      <div class="modal-fields" id="lib-edit-fields"></div>
      <div class="modal-actions">
        <button type="submit">Save</button>
        <button type="button" id="lib-edit-cancel">Cancel</button>
      </div>
    </div>
  </form>
  <div id="narrow-sheet" class="narrow-sheet" role="dialog" aria-modal="true" aria-label="Narrow" hidden>
    <div id="narrow-sheet-body" class="narrow-body"></div>
    <button type="button" id="narrow-done">Done</button>
  </div>
<script>
const q = document.getElementById("q");
const also = document.getElementById("also");
const chips = document.getElementById("chips");
const count = document.getElementById("count");
const err = document.getElementById("err");
const results = document.getElementById("results");
const wrap = document.getElementById("wrap");
const searchCol = document.getElementById("search-col");
const readerCol = document.getElementById("reader-col");
const tabStrip = document.getElementById("tabs");
const panes = document.getElementById("panes");
const indexLine = document.getElementById("index");
const savedRow = document.getElementById("saved");
const modeSearch = document.getElementById("mode-search");
const modeLibrary = document.getElementById("mode-library");
const searchView = document.getElementById("search-view");
const libraryView = document.getElementById("library-view");
const libFilter = document.getElementById("lib-filter");
const libRoots = document.getElementById("lib-roots");
const libStatus = document.getElementById("lib-status");
const libCount = document.getElementById("lib-count");
const libErr = document.getElementById("lib-err");
const libEdit = document.getElementById("lib-edit");
const libEditTitle = document.getElementById("lib-edit-title");
const libEditPath = document.getElementById("lib-edit-path");
const libEditFields = document.getElementById("lib-edit-fields");
const libRows = document.getElementById("lib-rows");
const searchNarrowOpen = document.getElementById("search-narrow-open");
const searchNarrowEl = document.getElementById("search-narrow");
const libNarrowOpen = document.getElementById("lib-narrow-open");
const libNarrowEl = document.getElementById("lib-narrow");
const narrowSheet = document.getElementById("narrow-sheet");
const narrowSheetBody = document.getElementById("narrow-sheet-body");
const narrowDone = document.getElementById("narrow-done");
let seq = 0;
let savedSeq = 0;
let alertSeq = 0;
let remembered = [];
let alerts = [];
let notes = [];

const extLabel = {
  pdf: "PDFs", txt: "Text", md: "Markdown", html: "HTML", htm: "HTML",
  docx: "Word", odt: "ODT", epub: "EPUB"
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c];
  });
}

function withMarks(s) {
  return esc(s).replace(/&lt;&lt;([\s\S]*?)&gt;&gt;/g, "<mark>$1</mark>");
}

function baseName(path) {
  const i = path.lastIndexOf("/");
  return i >= 0 ? path.slice(i + 1) : path;
}

function folderOf(path) {
  const i = path.lastIndexOf("/");
  return i > 0 ? path.slice(0, i) : "";
}

function parseFilters(s) {
  const found = [];
  let i = 0;
  while (i < s.length) {
    while (i < s.length && /\s/.test(s[i])) i++;
    if (i >= s.length) break;
    const start = i;
    let kind = "";
    if (s.startsWith("ext:", i)) kind = "ext";
    else if (s.startsWith("path:", i)) kind = "path";
    else if (s.startsWith("mtime:", i)) kind = "mtime";
    if (kind) {
      i += kind.length + 1;
      let value = "";
      if (s[i] === '"') {
        i++;
        let v = "";
        while (i < s.length && s[i] !== '"') {
          if (s[i] === "\\" && i + 1 < s.length) { i++; v += s[i]; }
          else v += s[i];
          i++;
        }
        value = v;
        if (s[i] === '"') i++;
      } else {
        const b = i;
        while (i < s.length && !/[\s)]/.test(s[i])) i++;
        value = s.slice(b, i);
      }
      if (value) found.push({kind: kind, value: value, start: start, end: i});
      continue;
    }
    if (s[i] === '"') {
      i++;
      while (i < s.length && s[i] !== '"') {
        if (s[i] === "\\") i++;
        i++;
      }
      if (s[i] === '"') i++;
    } else if (s[i] === "(") {
      i++;
    } else {
      while (i < s.length && !/[\s()]/.test(s[i])) i++;
    }
  }
  return found;
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function monthLabel(value) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(value || ""));
  if (!m) return String(value || "");
  const now = new Date();
  if (Number(m[1]) === now.getFullYear() && Number(m[2]) === now.getMonth() + 1) return "This month";
  const name = MONTHS[Number(m[2]) - 1] || m[2];
  return name + " " + m[1];
}

function chipText(f) {
  if (f.kind === "ext") {
    const key = f.value.replace(/^\./, "").toLowerCase();
    return extLabel[key] || f.value;
  }
  if (f.kind === "mtime") return monthLabel(f.value);
  const trimmed = f.value.replace(/\/+$/, "");
  const slash = trimmed.lastIndexOf("/");
  const leaf = slash >= 0 ? trimmed.slice(slash + 1) : trimmed;
  return leaf || f.value;
}

function normExt(v) {
  return String(v || "").replace(/^\./, "").toLowerCase();
}

function pathKey(v) {
  return String(v || "").replace(/\/+$/, "").toLowerCase();
}

function facetApplied(filters, kind, value) {
  for (let i = 0; i < filters.length; i++) {
    const f = filters[i];
    if (f.kind !== kind) continue;
    if (kind === "ext" && normExt(f.value) === normExt(value)) return true;
    if (kind === "path" && pathKey(f.value) === pathKey(value)) return true;
    if (kind === "mtime" && f.value === value) return true;
  }
  return false;
}

function quoteFilter(value) {
  const s = String(value);
  if (!/[\s"()]/.test(s)) return s;
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}

function leafOf(value) {
  const trimmed = String(value || "").replace(/\/+$/, "");
  const slash = trimmed.lastIndexOf("/");
  return slash >= 0 ? trimmed.slice(slash + 1) : trimmed;
}

function combinedQuery() {
  const a = q.value.trim();
  const b = also.value.trim();
  if (!a) return b;
  if (!b) return a;
  return "(" + a + ") AND (" + b + ")";
}

const NARROW_ORDER = ["language", "author", "form", "period", "genre"];
const NARROW_LABEL = {
  language: "Language",
  author: "Author",
  form: "Form",
  period: "Period",
  genre: "Genre"
};
const NARROW_EMPTY = "These fill in from the record.";
const NARROW_SEL_MAX = 64;

function emptyNarrow() {
  return {language: [], author: [], form: [], period: [], genre: []};
}

let searchNarrow = emptyNarrow();
let libraryNarrow = emptyNarrow();
let searchGroups = null;
let libraryGroups = null;
let sheetKind = "";
let sheetOpener = null;

function copyNarrow(sel) {
  const out = emptyNarrow();
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const key = NARROW_ORDER[i];
    out[key] = (sel && sel[key] ? sel[key] : []).slice();
  }
  return out;
}

function narrowActive(sel) {
  if (!sel) return false;
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const list = sel[NARROW_ORDER[i]];
    if (list && list.length) return true;
  }
  return false;
}

function groupsEmpty(narrow) {
  if (!narrow) return true;
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const rows = narrow[NARROW_ORDER[i]];
    if (rows && rows.length) return false;
  }
  return true;
}

function saveNarrow(key, sel) {
  try {
    sessionStorage.setItem(key, JSON.stringify(copyNarrow(sel)));
  } catch (e) {}
}

function readNarrow(key) {
  const out = emptyNarrow();
  let raw = "";
  try {
    raw = sessionStorage.getItem(key) || "";
  } catch (e) {
    return out;
  }
  if (!raw) return out;
  let data = null;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    return out;
  }
  if (!data || typeof data !== "object") return out;
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const keyName = NARROW_ORDER[i];
    const arr = data[keyName];
    if (!Array.isArray(arr)) continue;
    for (let j = 0; j < arr.length; j++) {
      const value = arr[j];
      if (typeof value !== "string" || !value) continue;
      if (out[keyName].length >= NARROW_SEL_MAX) break;
      out[keyName].push(value);
    }
  }
  return out;
}

function narrowSuffix(sel) {
  const parts = [];
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const key = NARROW_ORDER[i];
    const list = sel && sel[key] ? sel[key] : [];
    for (let j = 0; j < list.length; j++) {
      if (!list[j]) continue;
      parts.push(key + ":" + quoteFilter(list[j]));
    }
  }
  return parts.join(" ");
}

function shownQuery() {
  const box = combinedQuery();
  const suffix = narrowSuffix(searchNarrow);
  if (!box) return suffix;
  if (!suffix) return box;
  return box + " " + suffix;
}

function narrowArg(sel, key) {
  const list = sel && sel[key] ? sel[key] : [];
  return list.join("\n");
}

function toggleList(list, value) {
  const at = list.indexOf(value);
  if (at >= 0) {
    list.splice(at, 1);
    return true;
  }
  if (list.length >= NARROW_SEL_MAX) return false;
  list.push(value);
  return true;
}

function fillNarrow(el, narrow, sel, onToggle, onClear, emptyCopy) {
  if (!el) return;
  el.replaceChildren();
  const head = document.createElement("div");
  head.className = "narrow-head";
  const title = document.createElement("h2");
  title.className = "narrow-title";
  title.textContent = "Narrow";
  head.append(title);
  if (narrowActive(sel)) {
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "narrow-clear";
    clear.textContent = "Clear";
    clear.addEventListener("click", onClear);
    head.append(clear);
  }
  el.append(head);
  if (groupsEmpty(narrow)) {
    if (emptyCopy) {
      const note = document.createElement("p");
      note.className = "narrow-empty";
      note.textContent = emptyCopy;
      el.append(note);
    }
    return;
  }
  for (let i = 0; i < NARROW_ORDER.length; i++) {
    const key = NARROW_ORDER[i];
    const rows = narrow && Array.isArray(narrow[key]) ? narrow[key] : [];
    if (!rows.length) continue;
    const group = document.createElement("fieldset");
    group.className = "narrow-group";
    const legend = document.createElement("legend");
    legend.textContent = NARROW_LABEL[key];
    group.append(legend);
    const chosen = sel && sel[key] ? sel[key] : [];
    for (let j = 0; j < rows.length; j++) {
      const row = rows[j];
      if (!row || typeof row.value !== "string" || !row.value) continue;
      const value = row.value;
      const count = typeof row.count === "number" ? row.count : 0;
      const pressed = chosen.indexOf(value) >= 0;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "narrow-opt";
      btn.title = value;
      btn.setAttribute("aria-pressed", pressed ? "true" : "false");
      const files = count === 1 ? "file" : "files";
      btn.setAttribute("aria-label", value + ", " + count + " " + files);
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = value;
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = String(count);
      btn.append(name, n);
      btn.addEventListener("click", function () { onToggle(key, value); });
      group.append(btn);
    }
    if (group.querySelector(".narrow-opt")) el.append(group);
  }
}

function narrowButton(btn, sel) {
  if (!btn) return;
  btn.textContent = narrowActive(sel) ? "Narrow · on" : "Narrow";
}

function paintSearchNarrow() {
  const show = !groupsEmpty(searchGroups);
  if (searchNarrowEl) searchNarrowEl.hidden = !show;
  if (searchNarrowOpen) searchNarrowOpen.hidden = !show;
  narrowButton(searchNarrowOpen, searchNarrow);
  if (show) fillNarrow(searchNarrowEl, searchGroups, searchNarrow, toggleSearch, clearSearch, "");
  if (sheetKind === "search") {
    if (show && narrowSheet && !narrowSheet.hidden) {
      fillNarrow(narrowSheetBody, searchGroups, searchNarrow, toggleSearch, clearSearch, "");
    } else if (!show) {
      closeNarrowSheet();
    }
  }
}

function paintLibraryNarrow() {
  narrowButton(libNarrowOpen, libraryNarrow);
  const copy = groupsEmpty(libraryGroups) ? NARROW_EMPTY : "";
  fillNarrow(libNarrowEl, libraryGroups, libraryNarrow, toggleLibrary, clearLibrary, copy);
  if (sheetKind === "library" && narrowSheet && !narrowSheet.hidden) {
    fillNarrow(narrowSheetBody, libraryGroups, libraryNarrow, toggleLibrary, clearLibrary, copy);
  }
}

function toggleSearch(key, value) {
  if (!toggleList(searchNarrow[key], value)) {
    showError("too many values");
    return;
  }
  showError("");
  saveNarrow("grove.narrow.search", searchNarrow);
  paintSearchNarrow();
  runSearch();
}

function clearSearch() {
  searchNarrow = emptyNarrow();
  saveNarrow("grove.narrow.search", searchNarrow);
  paintSearchNarrow();
  runSearch();
}

function toggleLibrary(key, value) {
  if (!toggleList(libraryNarrow[key], value)) {
    showLibError("too many values");
    return;
  }
  showLibError("");
  saveNarrow("grove.narrow.library", libraryNarrow);
  paintLibraryNarrow();
  loadLibrary();
}

function clearLibrary() {
  libraryNarrow = emptyNarrow();
  saveNarrow("grove.narrow.library", libraryNarrow);
  paintLibraryNarrow();
  loadLibrary();
}

function openNarrowSheet(kind, opener) {
  sheetKind = kind;
  sheetOpener = opener || null;
  if (narrowSheet) narrowSheet.hidden = false;
  if (kind === "library") paintLibraryNarrow();
  else paintSearchNarrow();
  if (narrowDone) narrowDone.focus();
}

function closeNarrowSheet() {
  const was = narrowSheet && !narrowSheet.hidden;
  if (narrowSheet) narrowSheet.hidden = true;
  const back = sheetOpener;
  sheetKind = "";
  sheetOpener = null;
  if (was && back && back.isConnected) back.focus();
}


function collectFilters() {
  const out = [];
  [{el: q, line: "q"}, {el: also, line: "also"}].forEach(function (row) {
    parseFilters(row.el.value).forEach(function (f) {
      f.line = row.line;
      out.push(f);
    });
  });
  return out;
}

function stripKind(el, kind) {
  let cur = el.value;
  const same = parseFilters(cur).filter(function (f) { return f.kind === kind; });
  for (let i = same.length - 1; i >= 0; i--) {
    cur = (cur.slice(0, same[i].start) + " " + cur.slice(same[i].end)).replace(/\s+/g, " ").trim();
  }
  el.value = cur;
}

function addFilter(kind, value) {
  if (facetApplied(collectFilters(), kind, value)) return;
  stripKind(q, kind);
  stripKind(also, kind);
  const token = kind + ":" + quoteFilter(value);
  const cur = q.value.trim();
  q.value = cur ? cur + " " + token : token;
  q.focus();
  runSearch();
}

function drawFacets(facets) {
  const filters = collectFilters();
  const types = (facets && facets.types) || [];
  const folders = (facets && facets.folders) || [];
  const months = (facets && facets.months) || [];
  const leaves = {};
  folders.forEach(function (f) {
    const leaf = leafOf(f.value);
    leaves[leaf] = (leaves[leaf] || 0) + 1;
  });
  function add(kind, value, label, count) {
    if (!value || !count || facetApplied(filters, kind, value)) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip facet";
    btn.title = kind + ":" + value;
    const name = document.createElement("span");
    name.textContent = label;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = String(count);
    const files = count === 1 ? "file" : "files";
    btn.setAttribute("aria-label", label + ", " + count + " " + files);
    btn.append(name, n);
    btn.addEventListener("click", function () { addFilter(kind, value); });
    chips.append(btn);
  }
  types.forEach(function (f) {
    const key = normExt(f.value);
    add("ext", key, extLabel[key] || f.value, f.count);
  });
  folders.forEach(function (f) {
    const leaf = leafOf(f.value);
    const label = leaves[leaf] > 1 ? String(f.value).replace(/\/+$/, "") : leaf;
    add("path", f.value, label, f.count);
  });
  months.forEach(function (f) {
    add("mtime", f.value, monthLabel(f.value), f.count);
  });
}

function drawChips() {
  chips.replaceChildren();
  collectFilters().forEach(function (f) {
    const chip = document.createElement("span");
    chip.className = "chip";
    const label = document.createElement("span");
    label.textContent = chipText(f);
    label.title = f.kind + ":" + f.value;
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Remove " + label.textContent);
    rm.addEventListener("click", function () {
      const el = f.line === "also" ? also : q;
      const cur = el.value;
      el.value = (cur.slice(0, f.start) + " " + cur.slice(f.end)).replace(/\s+/g, " ").trim();
      el.focus();
      runSearch();
    });
    chip.append(label, rm);
    chips.append(chip);
  });
}

function showError(message) {
  err.hidden = !message;
  err.textContent = message || "";
}

function countLine(files, places) {
  const fileWord = files === 1 ? "file" : "files";
  const placeWord = places === 1 ? "place" : "places";
  let line = files + " " + fileWord + " · " + places + " " + placeWord;
  return line;
}

function addPassage(parent, hit, passage) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "passage";
  btn.dataset.path = hit.path || "";
  btn.dataset.offset = String(passage.offset || 0);
  const parts = [];
  if (passage.section) {
    parts.push(passage.section);
  }
  if (passage.page > 0) {
    parts.push("p." + passage.page);
  }
  if (parts.length) {
    const where = document.createElement("div");
    where.className = "where";
    where.textContent = parts.join(" · ");
    btn.append(where);
  }
  const text = document.createElement("p");
  text.className = "text";
  text.innerHTML = withMarks(passage.text || "");
  btn.append(text);
  btn.addEventListener("click", function () {
    openTab(hit.path, passage.offset || 0, markedWords(passage.text));
  });
  parent.append(btn);
  const slot = document.createElement("div");
  slot.className = "note-slot";
  slot.dataset.path = hit.path || "";
  slot.dataset.offset = String(passage.offset || 0);
  drawNote(slot, hit, passage);
  parent.append(slot);
}

function findNote(path, offset) {
  for (let i = 0; i < notes.length; i++) {
    if (notes[i].path === path && notes[i].offset === offset) return notes[i];
  }
  return null;
}

function drawNote(slot, hit, passage) {
  slot.replaceChildren();
  const path = hit.path || "";
  const offset = passage.offset || 0;
  const existing = findNote(path, offset);
  if (existing) {
    const line = document.createElement("p");
    line.className = "note";
    const text = document.createElement("span");
    text.textContent = existing.body;
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Remove note");
    rm.addEventListener("click", function (ev) {
      ev.stopPropagation();
      forgetNote(path, offset, slot, hit, passage);
    });
    line.append(text, rm);
    slot.append(line);
    return;
  }
  const add = document.createElement("button");
  add.type = "button";
  add.className = "note-add";
  add.textContent = "Note";
  add.addEventListener("click", function (ev) {
    ev.stopPropagation();
    openNote(slot, hit, passage);
  });
  slot.append(add);
}

function openNote(slot, hit, passage) {
  slot.replaceChildren();
  const input = document.createElement("input");
  input.type = "text";
  input.className = "note-in";
  input.placeholder = "Note";
  input.setAttribute("aria-label", "Note on this passage");
  input.maxLength = 400;
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      ev.preventDefault();
      keepNote(hit.path || "", passage.offset || 0, input.value, slot, hit, passage);
    } else if (ev.key === "Escape") {
      ev.preventDefault();
      drawNote(slot, hit, passage);
    }
  });
  slot.append(input);
  input.focus();
}

function takeNotes(raw) {
  const data = JSON.parse(raw);
  if (data && data.error) {
    showError(data.error);
    return false;
  }
  notes = (data && data.notes) || [];
  return true;
}

async function loadNotes() {
  try {
    const raw = await grove_notes();
    if (takeNotes(raw)) refreshNoteSlots();
  } catch (e) {}
}

function refreshNoteSlots() {
  const slots = document.querySelectorAll(".note-slot");
  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    if (slot.querySelector("input")) continue;
    drawNote(slot, { path: slot.dataset.path || "" }, { offset: Number(slot.dataset.offset || 0) });
  }
}

async function keepNote(path, offset, body, slot, hit, passage) {
  showError("");
  try {
    const raw = await grove_note(path, offset, body);
    if (!takeNotes(raw)) return;
    drawNote(slot, hit, passage);
  } catch (e) {
    showError("Could not keep the note");
  }
}

async function forgetNote(path, offset, slot, hit, passage) {
  showError("");
  try {
    const raw = await grove_forget_note(path, offset);
    if (!takeNotes(raw)) return;
    drawNote(slot, hit, passage);
  } catch (e) {
    showError("Could not remove the note");
  }
}

function walkPassages(art, hit, passages, query) {
  let shown = Math.min(2, passages.length);
  let more = !!hit.more;
  let busy = false;
  if (shown >= passages.length && !more) return;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "more";
  function label() {
    if (more) return "Show more";
    return "Show " + (passages.length - shown) + " more";
  }
  function reveal() {
    const n = passages.length;
    for (let i = shown; i < n; i++) addPassage(art, hit, passages[i]);
    art.append(btn);
    shown = n;
    markOpenPassages();
  }
  btn.textContent = label();
  btn.addEventListener("click", async function () {
    if (busy) return;
    const generation = seq;
    if (shown < passages.length) {
      reveal();
      if (!more) btn.remove();
      else btn.textContent = label();
      return;
    }
    if (!more) {
      btn.remove();
      return;
    }
    busy = true;
    btn.disabled = true;
    const last = passages[passages.length - 1];
    try {
      const raw = await grove_more(hit.path, last ? last.offset : 0, query);
      if (generation !== seq) return;
      const data = JSON.parse(raw);
      if (data.error) {
        showError(data.error);
        busy = false;
        btn.disabled = false;
        return;
      }
      const next = data.passages || [];
      for (let i = 0; i < next.length; i++) passages.push(next[i]);
      more = !!data.more && next.length > 0;
      reveal();
      if (!more && shown >= passages.length) btn.remove();
      else {
        busy = false;
        btn.disabled = false;
        btn.textContent = label();
      }
    } catch (err) {
      if (generation !== seq) return;
      showError("Could not show more");
      busy = false;
      btn.disabled = false;
    }
  });
  art.append(btn);
}

function render(hits, query) {
  results.replaceChildren();
  let places = 0;
  hits.forEach(function (hit) {
    const passages = hit.passages || [];
    const counted = hit.nmatches;
    places += typeof counted === "number" && counted > 0 ? counted : passages.length;
    const art = document.createElement("article");
    const name = document.createElement("button");
    name.type = "button";
    name.className = "name";
    name.textContent = baseName(hit.path || "");
    name.addEventListener("click", function () { openPath(hit.path); });
    art.append(name);
    const folder = folderOf(hit.path || "");
    if (folder) {
      const line = document.createElement("p");
      line.className = "folder";
      line.textContent = folder;
      line.title = folder;
      art.append(line);
    }
    const title = (hit.title || "").trim();
    const first = ((passages[0] && passages[0].text) || "").replace(/<<|>>/g, "");
    const titleShown = title && title.toLowerCase() !== baseName(hit.path || "").toLowerCase() &&
      first.toLowerCase().indexOf(title.toLowerCase()) === -1;
    if (titleShown) {
      const line = document.createElement("p");
      line.className = "doctitle";
      line.textContent = title;
      art.append(line);
    }
    const shown = Math.min(2, passages.length);
    for (let i = 0; i < shown; i++) addPassage(art, hit, passages[i]);
    walkPassages(art, hit, passages, query);
    results.append(art);
  });
  markOpenPassages();
  return places;
}

let tabs = [];
let tabIds = 0;
let activeId = 0;

function utf8Index(text, byteOff) {
  const enc = new TextEncoder();
  let bytes = 0;
  let index = 0;
  for (const ch of text) {
    const n = enc.encode(ch).length;
    if (bytes >= byteOff) return index;
    if (bytes + n > byteOff) return index;
    bytes += n;
    index += ch.length;
  }
  return text.length;
}

function markedWords(text) {
  const m = /<<([\s\S]*?)>>/.exec(text || "");
  if (!m) return "";
  return m[1].replace(/\s+/g, " ").trim();
}

function escapeRegExp(s) {
  return s.replace(/[\\^$.*+?()[\]{}|]/g, "\\$&");
}

function locatePhrase(text, focus, phrase) {
  if (!phrase || focus < 0) return null;
  const parts = phrase.split(" ").filter(function (w) { return w.length; });
  if (!parts.length) return null;
  const re = new RegExp(parts.map(escapeRegExp).join("\\s+"), "g");
  let best = null;
  let m;
  while ((m = re.exec(text))) {
    const cand = { a: m.index, b: m.index + m[0].length };
    if (!best || Math.abs(cand.a - focus) < Math.abs(best.a - focus)) best = cand;
    if (m.index >= focus) break;
    if (m[0].length === 0) re.lastIndex++;
  }
  return best;
}

function renderProse(readerBody, text, span, pages) {
  readerBody.replaceChildren();
  const markA = span ? span.a : -1;
  const markB = span ? span.b : -1;
  const points = [0, text.length];
  if (markA > 0) points.push(markA);
  if (markB > 0 && markB < text.length) points.push(markB);
  const pageAt = {};
  pages.forEach(function (p) {
    if (p.index > 0 && p.index < text.length) {
      points.push(p.index);
      pageAt[p.index] = p.page;
    }
  });
  points.sort(function (a, b) { return a - b; });
  const cuts = [];
  points.forEach(function (p) {
    if (!cuts.length || cuts[cuts.length - 1] !== p) cuts.push(p);
  });
  for (let k = 0; k < cuts.length - 1; k++) {
    const a = cuts[k];
    const b = cuts[k + 1];
    if (pageAt[a]) {
      const lab = document.createElement("div");
      lab.className = "page-label";
      lab.textContent = "p. " + pageAt[a];
      readerBody.append(lab);
    }
    const slice = text.slice(a, b).replace(/\f/g, "\n");
    if (!slice) continue;
    const marked = markA >= 0 && a >= markA && b <= markB;
    if (marked) {
      let mark = readerBody.lastChild && readerBody.lastChild.tagName === "MARK" ? readerBody.lastChild : null;
      if (!mark) {
        mark = document.createElement("mark");
        if (!readerBody.querySelector("mark.here")) mark.className = "here";
        readerBody.append(mark);
      }
      mark.append(document.createTextNode(slice));
    } else {
      readerBody.append(document.createTextNode(slice));
    }
  }
}

function sectionAt(heads, at) {
  const stack = [];
  (heads || []).forEach(function (head) {
    if ((head.at || 0) > at) return;
    const lv = head.level || 1;
    while (stack.length && (stack[stack.length - 1].level || 1) >= lv) stack.pop();
    stack.push(head);
  });
  const parts = [];
  stack.forEach(function (head) {
    const text = (head.text || "").trim();
    if (text) parts.push(text);
  });
  return parts.join(" · ");
}

function stemName(path) {
  const base = baseName(path || "");
  const dot = base.lastIndexOf(".");
  return dot > 0 ? base.slice(0, dot) : base;
}

function tabName(tab) {
  const book = (tab.book || "").trim() || stemName(tab.path);
  const others = tabs.some(function (t) { return t !== tab && t.path === tab.path; });
  if (!others) return book;
  const head = (tab.section || "").split(" · ").filter(Boolean).pop();
  const phrase = (tab.phrase || "").trim();
  if (head && phrase) return head + " · " + phrase;
  return head || phrase || book;
}

function markOpenPassages() {
  const buttons = document.querySelectorAll(".passage");
  buttons.forEach(function (btn) {
    let open = false;
    let on = false;
    for (let i = 0; i < tabs.length; i++) {
      if (tabs[i].path !== btn.dataset.path || String(tabs[i].anchor) !== btn.dataset.offset) continue;
      open = true;
      if (tabs[i].id === activeId) on = true;
    }
    btn.classList.toggle("open", open);
    btn.classList.toggle("on", on);
  });
}

function drawTabStrip() {
  tabStrip.replaceChildren();
  tabs.forEach(function (tab) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab" + (tab.id === activeId ? " on" : "");
    const label = document.createElement("span");
    label.className = "tab-label";
    label.textContent = tabName(tab);
    btn.title = tabName(tab);
    btn.addEventListener("click", function () { showTab(tab, false); });
    const x = document.createElement("span");
    x.className = "tab-x";
    x.textContent = "×";
    x.setAttribute("aria-label", "Close " + label.textContent);
    x.addEventListener("click", function (e) {
      e.stopPropagation();
      closeTab(tab);
    });
    btn.append(label, x);
    tabStrip.append(btn);
  });
  requestAnimationFrame(syncTabHeight);
}

function syncTabHeight() {
  const h = tabStrip.getBoundingClientRect().height;
  if (h > 0) readerCol.style.setProperty("--tabs-h", h + "px");
}

if (typeof ResizeObserver === "function") {
  new ResizeObserver(syncTabHeight).observe(tabStrip);
}

function setSplit(on) {
  const y = searchCol.scrollTop;
  wrap.classList.toggle("split", on);
  readerCol.hidden = !on;
  if (on) searchCol.scrollTop = y;
}

function showTab(tab, fresh) {
  if (activeId && activeId !== tab.id) {
    const prev = tabs.find(function (t) { return t.id === activeId; });
    if (prev) prev.scroll = readerCol.scrollTop;
  }
  activeId = tab.id;
  tabs.forEach(function (t) { t.panel.hidden = t.id !== tab.id; });
  setSplit(true);
  drawTabStrip();
  markOpenPassages();
  if (fresh) readerCol.scrollTop = 0;
  else if (tab.pendingMark) settleMark(tab);
  else readerCol.scrollTop = tab.scroll || 0;
}

function closeTab(tab) {
  const i = tabs.indexOf(tab);
  if (i < 0) return;
  tab.seq++;
  tab.panel.remove();
  tabs.splice(i, 1);
  if (activeId === tab.id) {
    const next = tabs[i] || tabs[i - 1];
    if (next) showTab(next, false);
    else {
      activeId = 0;
      setSplit(false);
      drawTabStrip();
      markOpenPassages();
    }
  } else {
    drawTabStrip();
    markOpenPassages();
  }
}

function makeTab(path, anchor, phrase) {
  const panel = document.createElement("main");
  panel.className = "reader";
  panel.hidden = true;
  const bar = document.createElement("div");
  bar.className = "reader-bar";
  const nav = document.createElement("p");
  nav.className = "reader-nav";
  const prev = document.createElement("button");
  prev.type = "button";
  prev.className = "reader-prev";
  prev.textContent = "Earlier";
  const next = document.createElement("button");
  next.type = "button";
  next.className = "reader-next";
  next.textContent = "Later";
  const orig = document.createElement("button");
  orig.type = "button";
  orig.textContent = "Original file";
  nav.append(prev, next, orig);
  const where = document.createElement("p");
  where.className = "where reader-where";
  const errLine = document.createElement("p");
  errLine.className = "err";
  errLine.hidden = true;
  bar.append(nav, where, errLine);
  const title = document.createElement("h1");
  title.className = "reader-title";
  title.textContent = stemName(path);
  const toc = document.createElement("div");
  const body = document.createElement("article");
  body.className = "reader-body";
  panel.append(bar, title, toc, body);
  panes.append(panel);
  const tab = {
    id: ++tabIds,
    path: path,
    anchor: anchor,
    phrase: phrase || "",
    book: "",
    section: "",
    seq: 0,
    scroll: 0,
    panel: panel,
    titleEl: title,
    whereEl: where,
    tocEl: toc,
    bodyEl: body,
    prevEl: prev,
    nextEl: next,
    errEl: errLine
  };
  orig.addEventListener("click", function () { openPath(tab.path); });
  return tab;
}

function drawReader(tab, data) {
  tab.book = (data.title || "").trim() || stemName(tab.path);
  tab.titleEl.textContent = tab.book;
  tab.tocEl.replaceChildren();
  const heads = data.heads || [];
  let section = data.section || "";
  if ((data.at || 0) >= (data.to || 0) && (data.from || 0) < (data.at || 0)) {
    const atStart = sectionAt(heads, data.from || 0);
    if (atStart) section = atStart;
  }
  tab.section = section;
  const parts = [];
  if (section) parts.push(section);
  if (data.page > 0) parts.push("p. " + data.page);
  tab.whereEl.textContent = parts.join(" · ");
  if (heads.length) {
    const details = document.createElement("details");
    details.className = "toc";
    const summary = document.createElement("summary");
    summary.textContent = "Contents";
    const list = document.createElement("div");
    heads.forEach(function (head) {
      const btn = document.createElement("button");
      btn.type = "button";
      const lv = Math.max(1, Math.min(3, head.level || 1));
      btn.className = "lv" + lv;
      btn.textContent = head.text || "";
      btn.addEventListener("click", function () {
        tab.phrase = "";
        loadTab(tab, head.at || 0, 0);
      });
      list.append(btn);
    });
    details.append(summary, list);
    tab.tocEl.append(details);
  }
  const text = data.text || "";
  const rel = data.at >= data.from && data.at < data.to ? data.at - data.from : -1;
  const focus = rel >= 0 ? utf8Index(text, rel) : -1;
  const pages = (data.pages || []).map(function (p) {
    return { index: utf8Index(text, Math.max(0, (p.at || 0) - (data.from || 0))), page: p.page };
  });
  const span = tab.phrase ? locatePhrase(text, focus, tab.phrase) : null;
  renderProse(tab.bodyEl, text, span, pages);
  tab.prevEl.disabled = !data.from;
  tab.nextEl.disabled = data.to >= data.length;
  tab.prevEl.onclick = function () { loadTab(tab, data.from, -1); };
  tab.nextEl.onclick = function () { loadTab(tab, data.to, 1); };
  tab.errEl.hidden = true;
  tab.errEl.textContent = "";
  tab.pendingMark = true;
  drawTabStrip();
  if (tab.id === activeId) settleMark(tab);
}

function settleMark(tab) {
  const here = tab.bodyEl.querySelector("mark.here");
  if (here) here.scrollIntoView({ block: "center", inline: "nearest" });
  else readerCol.scrollTop = 0;
  tab.pendingMark = false;
  tab.scroll = readerCol.scrollTop;
}

async function loadTab(tab, at, dir) {
  const seq = ++tab.seq;
  tab.errEl.hidden = true;
  tab.errEl.textContent = "";
  try {
    const raw = await grove_read(tab.path, String(at || 0), String(dir || 0));
    if (seq !== tab.seq) return;
    const data = JSON.parse(raw);
    if (data.error) {
      tab.errEl.hidden = false;
      tab.errEl.textContent = data.error;
      return;
    }
    drawReader(tab, data);
  } catch (e) {
    if (seq !== tab.seq) return;
    tab.errEl.hidden = false;
    tab.errEl.textContent = "Could not open the text";
  }
}

async function openTab(path, anchor, phrase) {
  let tab = null;
  for (let i = 0; i < tabs.length; i++) {
    if (tabs[i].path === path && tabs[i].anchor === anchor) {
      tab = tabs[i];
      break;
    }
  }
  if (!tab) {
    tab = makeTab(path, anchor, phrase || "");
    tabs.push(tab);
  } else if (phrase) {
    tab.phrase = phrase;
  }
  showTab(tab, true);
  await loadTab(tab, anchor, 0);
}

async function openPath(path, at, page, needle) {
  showError("");
  try {
    const raw = arguments.length > 1
      ? await grove_open(path, String(at), String(page || 0), needle || "")
      : await grove_open(path);
    const data = JSON.parse(raw);
    if (data.error) showError(data.error);
  } catch (e) {
    showError("Could not open the file");
  }
}

function alertCount(query) {
  for (let i = 0; i < alerts.length; i++) {
    if (alerts[i].query === query) return alerts[i].count || 0;
  }
  return -1;
}

function drawSaved() {
  savedRow.replaceChildren();
  const current = combinedQuery();
  const watched = shownQuery();
  const watching = watched && alertCount(watched) >= 0;
  if (current && remembered.indexOf(current) < 0) {
    const keep = document.createElement("button");
    keep.type = "button";
    keep.className = "save";
    keep.textContent = "Save";
    keep.setAttribute("aria-label", "Save this search");
    keep.addEventListener("click", function () { remember(current); });
    savedRow.append(keep);
  }
  if (watched && !watching) {
    const watch = document.createElement("button");
    watch.type = "button";
    watch.className = "watch";
    watch.textContent = "Watch";
    watch.setAttribute("aria-label", "Watch this search");
    watch.addEventListener("click", function () { watchQuery(watched); });
    savedRow.append(watch);
  }
  if (watching) {
    const stop = document.createElement("button");
    stop.type = "button";
    stop.className = "unwatch";
    stop.textContent = "Unwatch";
    stop.setAttribute("aria-label", "Stop watching this search");
    stop.addEventListener("click", function () { unwatchQuery(watched); });
    savedRow.append(stop);
  }
  remembered.forEach(function (query) {
    const chip = document.createElement("span");
    chip.className = "chip";
    const label = document.createElement("button");
    label.type = "button";
    label.className = "q";
    label.textContent = query;
    label.title = query;
    label.addEventListener("click", function () {
      q.value = query;
      also.value = "";
      q.focus();
      runSearch();
    });
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Forget this search");
    rm.addEventListener("click", function () { forget(query); });
    const n = alertCount(query);
    if (n > 0) {
      const neu = document.createElement("button");
      neu.type = "button";
      neu.className = "new";
      neu.textContent = n + " new";
      neu.setAttribute("aria-label", "Mark new files seen");
      neu.addEventListener("click", function () { seenNew(query); });
      chip.append(label, neu, rm);
    } else {
      chip.append(label, rm);
    }
    savedRow.append(chip);
  });
}

function applySaved(raw) {
  const data = JSON.parse(raw);
  if (data && data.error) {
    showError(data.error);
    return;
  }
  remembered = (data && data.saved) || [];
  drawSaved();
}

async function loadSaved() {
  const id = ++savedSeq;
  try {
    const raw = await grove_saved();
    if (id !== savedSeq) return;
    applySaved(raw);
  } catch (e) {}
}

async function remember(query) {
  const id = ++savedSeq;
  showError("");
  try {
    const raw = await grove_save(query);
    if (id !== savedSeq) return;
    applySaved(raw);
  } catch (e) {
    if (id === savedSeq) showError("Could not save");
  }
}

async function forget(query) {
  const id = ++savedSeq;
  showError("");
  try {
    const raw = await grove_forget(query);
    if (id !== savedSeq) return;
    applySaved(raw);
    await loadAlerts();
  } catch (e) {
    if (id === savedSeq) showError("Could not forget");
  }
}

function applyAlerts(raw) {
  const data = JSON.parse(raw);
  if (data && data.error) {
    showError(data.error);
    return false;
  }
  alerts = (data && data.alerts) || [];
  drawSaved();
  return true;
}

async function loadAlerts() {
  const id = ++alertSeq;
  try {
    const raw = await grove_alerts();
    if (id !== alertSeq) return;
    applyAlerts(raw);
  } catch (e) {}
}

async function watchQuery(query) {
  const id = ++alertSeq;
  showError("");
  try {
    const raw = await grove_watch(query);
    if (id !== alertSeq) return false;
    const ok = applyAlerts(raw);
    await loadSaved();
    return ok;
  } catch (e) {
    if (id === alertSeq) showError("Could not watch");
    return false;
  }
}

async function unwatchQuery(query) {
  const id = ++alertSeq;
  showError("");
  try {
    const raw = await grove_unwatch(query);
    if (id !== alertSeq) return;
    applyAlerts(raw);
  } catch (e) {
    if (id === alertSeq) showError("Could not unwatch");
  }
}

async function seenNew(query) {
  q.value = query;
  also.value = "";
  q.focus();
  if (await watchQuery(query)) runSearch();
}

async function runSearch() {
  const id = ++seq;
  const query = shownQuery();
  drawChips();
  drawSaved();
  showError("");
  if (!query.trim()) {
    results.replaceChildren();
    count.textContent = "";
    searchGroups = null;
    paintSearchNarrow();
    return;
  }
  count.textContent = "Searching…";
  let raw;
  try {
    raw = await grove_search(query);
  } catch (e) {
    if (id !== seq) return;
    count.textContent = "";
    showError("Search failed");
    searchGroups = null;
    paintSearchNarrow();
    return;
  }
  if (id !== seq) return;
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    count.textContent = "";
    showError("Search failed");
    searchGroups = null;
    paintSearchNarrow();
    return;
  }
  if (data && data.error) {
    results.replaceChildren();
    count.textContent = "";
    showError(data.error);
    searchGroups = null;
    paintSearchNarrow();
    return;
  }
  const hits = Array.isArray(data) ? data : (data.hits || []);
  searchGroups = data && data.facets && data.facets.narrow ? data.facets.narrow : null;
  paintSearchNarrow();
  drawFacets(data && data.facets);
  const places = render(hits, query);
  count.textContent = hits.length ? countLine(hits.length, places) : "No places";
}

document.getElementById("find").addEventListener("submit", function (e) {
  e.preventDefault();
  runSearch();
});
function onQueryInput() {
  drawChips();
  drawSaved();
}
q.addEventListener("input", onQueryInput);
also.addEventListener("input", onQueryInput);

async function loadInfo() {
  try {
    const raw = await grove_info();

    if (info.error) {
      indexLine.textContent = info.error;
      indexLine.classList.add("error");

      indexLine.title = info.index || "";
    }
  } catch (e) {
    indexLine.textContent = "";
  }
}

const LIB_FIELDS = [
  ["title", "Title", false],
  ["creator", "Creator", false],
  ["date", "Date", false],
  ["language", "Language", false],
  ["type", "Type", false],
  ["subject", "Subject", false],
  ["coverage", "Coverage", false],
  ["source", "Source", false],
  ["description", "Description", true],
  ["publisher", "Publisher", false],
  ["contributor", "Contributor", false],
  ["format", "Format", false],
  ["identifier", "Identifier", false],
  ["relation", "Relation", false],
  ["rights", "Rights", true]
];
let groveView = "search";
let editing = "";
let editingLabel = "";
let editReturn = null;
let shelfData = null;
let shelfSeq = 0;
let listSeq = 0;
let jobWatch = 0;
let filterTimer = 0;

function showLibError(message) {
  libErr.hidden = !message;
  libErr.textContent = message || "";
}

function fieldValue(key) {
  const el = document.getElementById("lib-f-" + key);
  return el ? el.value : "";
}

function fileTail(path) {
  const value = path || "";
  const cut = Math.max(value.lastIndexOf("/"), value.lastIndexOf("\\"));
  return cut >= 0 ? value.slice(cut + 1) : value;
}

function editorHeading() {
  const typed = fieldValue("title").trim();
  libEditTitle.textContent = typed || editingLabel || "Volume";
}

function buildEditor() {
  LIB_FIELDS.forEach(function (row) {
    const label = document.createElement("label");

    if (!row[2]) input.type = "text";
    input.autocomplete = "off";

    if (row[0] === "title") input.addEventListener("input", editorHeading);

function closeEditor() {
  editing = "";

function openEditor(vol, opener) {
  closeNarrowSheet();

function metaLine(vol) {
  return ["creator", "type", "language", "subject"].map(function (key) {

  }).filter(function (s) { return s; }).join(" · ");

function countLineLib(data) {
  const total = data.total || 0;
  const shown = data.shown || 0;
  if (!total) return "No volumes";
  if (shown < total) return shown + " of " + total;
  return total + (total === 1 ? " volume" : " volumes");

function drawLibrary(data) {
  shelfData = data;
  libraryGroups = data && data.narrow ? data.narrow : null;
  paintLibraryNarrow();
  showLibError("");
  drawRoots(data.roots);
  libCount.textContent = countLineLib(data);
  libRows.replaceChildren();
  (data.volumes || []).forEach(function (vol) {
    const row = document.createElement("article");
    row.className = "lib-row";
    const title = document.createElement("button");
    title.type = "button";
    title.className = "lib-title";
    title.textContent = vol.title || vol.path || "";
    title.addEventListener("click", function () { openTab(vol.path, 0, ""); });
    const meta = document.createElement("p");
    meta.className = "lib-meta";
    meta.textContent = metaLine(vol);
    const path = document.createElement("p");
    path.className = "lib-path";
    path.textContent = vol.path || "";
    path.title = vol.path || "";
    const actions = document.createElement("div");
    actions.className = "lib-actions";
    const open = document.createElement("button");
    open.type = "button";
    open.textContent = "Open";
    open.addEventListener("click", function () { openTab(vol.path, 0, ""); });
    const edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.addEventListener("click", function () { openEditor(vol, edit); });
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Remove";
    remove.addEventListener("click", function () { askRemove(actions, vol); });
    actions.append(open, edit, remove);
    if (!meta.textContent) meta.hidden = true;
    row.append(title, meta, path, actions);
    libRows.append(row);
  });
}

async function loadLibrary() {
  const id = ++listSeq;
  try {
    const raw = await grove_library(
      libFilter.value || "",
      narrowArg(libraryNarrow, "language"),
      narrowArg(libraryNarrow, "author"),
      narrowArg(libraryNarrow, "form"),
      narrowArg(libraryNarrow, "period"),
      narrowArg(libraryNarrow, "genre")
    );
    if (id !== listSeq || groveView !== "library") return;
    const data = JSON.parse(raw);
    if (data.error) {
      if (groveView === "library" && data.error.indexOf("Preparing") === 0) {
        ensureShelf();
        return;
      }
      showLibError(data.error);
      return;
    }
    drawLibrary(data);
  } catch (e) {
    if (id === listSeq) showLibError("Could not read the library");
  }
}

function jobLine(job) {
  return "indexed " + (job.indexed || 0) + ", unchanged " + (job.unchanged || 0) +
    ", removed " + (job.removed || 0) + ", skipped " + (job.skipped || 0);
}

function watchJob() {
  const id = ++jobWatch;
  async function step() {
    if (id !== jobWatch) return;
    try {
      const raw = await grove_job();
      if (id !== jobWatch) return;
      const job = JSON.parse(raw);
      if (job.error && !job.running && job.ok === 0 && job.kind) {
        if (groveView === "library") {
          libStatus.textContent = "";
          showLibError(job.error);
        }
        return;
      }
      if (job.running) {
        if (groveView === "library") {
          libStatus.textContent = job.kind === 2 ? "Adding files…" : "Preparing the shelf… Search waits until this finishes.";
        }
        setTimeout(step, 400);
        return;
      }
      if (groveView === "library") {
        libStatus.textContent = job.kind === 2 ? jobLine(job) : "";
      }
      if (job.kind) {
        loadInfo();
        loadLibrary();
      }
    } catch (e) {
      if (id === jobWatch && groveView === "library") showLibError("Could not update the library");
    }
  }
  step();
}

async function ensureShelf() {
  const id = ++shelfSeq;
  try {
    const raw = await grove_shelf();
    if (id !== shelfSeq || groveView !== "library") return;
    const data = JSON.parse(raw);
    if (data.ready) {
      libStatus.textContent = "";
      loadLibrary();
      return;
    }
    if (data.preparing) {
      libStatus.textContent = "Preparing the shelf… Search waits until this finishes.";
      libCount.textContent = "";
      libRows.replaceChildren();
      watchJob();
      return;
    }
    showLibError(data.error || "Could not open the library");
  } catch (e) {
    if (id === shelfSeq) showLibError("Could not open the library");
  }
}

function setView(name) {
  const next = name === "library" ? "library" : "search";
  if (next !== "library") closeEditor();
  closeNarrowSheet();
  groveView = next;
  searchView.hidden = groveView !== "search";
  libraryView.hidden = groveView !== "library";
  modeSearch.classList.toggle("on", groveView === "search");
  modeLibrary.classList.toggle("on", groveView === "library");
  modeSearch.setAttribute("aria-pressed", groveView === "search" ? "true" : "false");
  modeLibrary.setAttribute("aria-pressed", groveView === "library" ? "true" : "false");
  try { sessionStorage.setItem("grove.view", groveView); } catch (e) {}
  if (groveView === "library") ensureShelf();
  else q.focus();
}

async function addPath(path) {
  showLibError("");
  if (!path) return;
  try {
    const raw = await grove_add(path);
    const data = JSON.parse(raw);
    if (data.error) {
      showLibError(data.error);
      return;
    }
    libStatus.textContent = "Adding files…";
    watchJob();
  } catch (e) {
    showLibError("Could not add that path");
  }
}

async function pickPath(kind) {
  showLibError("");
  try {
    const raw = await grove_pick(kind);
    const data = JSON.parse(raw);
    if (data.error) {
      showLibError(data.error);
      return;
    }
    if (!data.path) return;
    addPath(data.path);
  } catch (e) {
    showLibError("Could not open the chooser");
  }
}

async function dropVolume(path) {
  showLibError("");
  try {
    const raw = await grove_drop(path);
    const data = JSON.parse(raw);
    if (data.error) {
      showLibError(data.error);
      return;
    }
    if (editing === path) closeEditor();
    loadLibrary();
  } catch (e) {
    showLibError("Could not remove the volume");
  }
}

async function saveRecord(ev) {
  ev.preventDefault();
  const path = editing;
  if (!path) return;
  showLibError("");
  try {
    const raw = await grove_catalog(
      path,
      fieldValue("title"),
      fieldValue("creator"),
      fieldValue("date"),
      fieldValue("language"),
      fieldValue("type"),
      fieldValue("subject"),
      fieldValue("coverage"),
      fieldValue("source"),
      fieldValue("description"),
      fieldValue("publisher"),
      fieldValue("contributor"),
      fieldValue("format"),
      fieldValue("identifier"),
      fieldValue("relation"),
      fieldValue("rights")
    );
    const data = JSON.parse(raw);
    if (data.error) {
      showLibError(data.error);
      return;
    }
    closeEditor();
    loadLibrary();
  } catch (e) {
    showLibError("Could not save the record");
  }
}

function restoreView() {
  let name = "";
  try { name = sessionStorage.getItem("grove.view") || ""; } catch (e) { return; }
  if (name === "library" && typeof grove_shelf === "function") setView("library");
}

modeSearch.addEventListener("click", function () { setView("search"); });
modeLibrary.addEventListener("click", function () { setView("library"); });
document.getElementById("lib-folder").addEventListener("click", function () { pickPath("dir"); });
document.getElementById("lib-file").addEventListener("click", function () { pickPath("file"); });
libFilter.addEventListener("input", function () {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(loadLibrary, 200);
});
libEdit.addEventListener("submit", saveRecord);
libEdit.addEventListener("click", function (ev) {
  if (ev.target === libEdit) closeEditor();
});
document.getElementById("lib-edit-cancel").addEventListener("click", closeEditor);
document.addEventListener("keydown", function (ev) {
  if (!libEdit.hidden) {
    if (ev.key === "Escape") {
      ev.preventDefault();
      closeEditor();
      return;
    }
    if (ev.key !== "Tab") return;
    const nodes = libEdit.querySelectorAll("input, textarea, button");
    if (!nodes.length) return;
    const first = nodes[0];
    const last = nodes[nodes.length - 1];
    if (ev.shiftKey && document.activeElement === first) {
      ev.preventDefault();
      last.focus();
    } else if (!ev.shiftKey && document.activeElement === last) {
      ev.preventDefault();
      first.focus();
    }
    return;
  }
  if (narrowSheet && !narrowSheet.hidden && ev.key === "Escape") {
    ev.preventDefault();
    closeNarrowSheet();
  }
});
buildEditor();

function whenReady(fn) {
  if (typeof grove_info === "function") fn();
  else setTimeout(function () { whenReady(fn); }, 40);
}
function restoreQuery() {
  let qv = "";
  let av = "";
  try {
    qv = sessionStorage.getItem("grove.q") || "";
    av = sessionStorage.getItem("grove.also") || "";
  } catch (e) {}
  if (qv) q.value = qv;
  if (av) also.value = av;
  if (qv || av || narrowActive(searchNarrow)) runSearch();
}
searchNarrow = readNarrow("grove.narrow.search");
libraryNarrow = readNarrow("grove.narrow.library");
paintLibraryNarrow();
if (searchNarrowOpen) {
  searchNarrowOpen.addEventListener("click", function () {
    openNarrowSheet("search", searchNarrowOpen);
  });
}
if (libNarrowOpen) {
  libNarrowOpen.addEventListener("click", function () {
    openNarrowSheet("library", libNarrowOpen);
  });
}
if (narrowDone) narrowDone.addEventListener("click", closeNarrowSheet);
whenReady(function () {
  loadInfo();
  loadSaved();
  loadNotes();
  loadAlerts();
  restoreQuery();
  restoreView();
});
</script>
</body>
</html>
