name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libx11-dev python3
      - name: Build and test
        run: make test
      - name: Check the one executable
        run: |
          set -euo pipefail
          ./grove --version
          ./grove help >/dev/null
          ./grove ui --help >/dev/null
          # grep -q would close the pipe early. LLVM nm treats that as a fatal error.
          syms=$(nm -g grove)
          grep -q grove_ui_attach <<<"$syms"
          grep -q webui_show <<<"$syms"
          if ldd grove | grep -E 'libz\.so|libX11'; then
            echo "grove should not need libz or libX11 to start" >&2
            exit 1
          fi
          mkdir -p dist
          cp grove dist/grove-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: grove-linux-x86_64
          path: dist/grove-linux-x86_64
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Package this Mac
        id: pack
        run: |
          set -euo pipefail
          ./grove --version
          ./grove help >/dev/null
          ./grove ui --help >/dev/null
          # grep -q would close the pipe early. LLVM nm treats that as a fatal error.
          syms=$(nm -g grove)
          grep -q grove_ui_attach <<<"$syms"
          grep -q webui_show <<<"$syms"
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64) arch=x86_64 ;;
            *) arch="$(uname -m)" ;;
          esac
          mkdir -p dist
          cp grove "dist/grove-macos-${arch}"
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: grove-macos-${{ steps.pack.outputs.arch }}
          path: dist/grove-macos-${{ steps.pack.outputs.arch }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            python
            curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
      - name: Build and smoke
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make test
          ./grove.exe --version
          ./grove.exe help >/dev/null
          ./grove.exe ui --help >/dev/null
          d=$(mktemp -d)
          printf '%s\n' 'portable search lives here' > "$d/note.txt"
          ./grove.exe --index "$d/idx" index "$d"
          ./grove.exe --index "$d/idx" search 'portable search' | grep -q 'note.txt'
          rm -rf "$d"
          mkdir -p dist
          cp grove.exe dist/grove-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: grove-windows-x86_64
          path: dist/grove-windows-x86_64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: grove-*
          path: dist
      - name: Publish the programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mapfile -t files < <(find dist -type f | sort)
          test "${#files[@]}" -gt 0
          notes=$(mktemp)
          cat > "$notes" << EOF
          grove ${ver}, built from \`${GITHUB_SHA::7}\`.

          Each file is one platform's program. On Linux and macOS, chmod +x the file before running it.

          A command does not open a browser. The same program opens the window.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --prerelease \
              --title "grove ${ver}" \
              --notes-file "$notes"
          fi
